# ─────────────────────────────────────────────────────────────
# TRCF ERP — BẢN GIAO KHÁCH (ảnh GHCR private + Postgres chạy bằng Docker)
# Cài tự động: ./install.sh   (xem README.md)
# Stack TỰ-CHỨA: frontend + backend + Postgres — KHÔNG cần Neon/DB ngoài.
# Dữ liệu nằm ở volume "pgdata" (nhớ sao lưu — xem README).
# ─────────────────────────────────────────────────────────────
name: trcf-erp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trcf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD bắt buộc — đặt trong .env}
      POSTGRES_DB: ${DB_NAME:-trcf_erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # KHÔNG publish cổng 5432 ra host — chỉ dùng nội bộ mạng compose (an toàn hơn).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trcf} -d ${DB_NAME:-trcf_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ghcr.io/nguyentrucanhtuan/trcf-erp-backend:${IMAGE_TAG:-latest}
    pull_policy: always                  # luôn lấy bản mới nhất khi up
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    environment:
      PORT: 3333
      # DATABASE_URL tự dựng từ DB_* → trỏ Postgres nội bộ (không sslmode → backend tự tắt SSL).
      # Muốn dùng DB NGOÀI (Neon...): thay cả dòng dưới bằng chuỗi của bạn (cloud cần ?sslmode=require).
      DATABASE_URL: postgresql://${DB_USER:-trcf}:${DB_PASSWORD:?DB_PASSWORD bắt buộc}@postgres:5432/${DB_NAME:-trcf_erp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET bắt buộc — openssl rand -hex 32}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:?ADMIN_SEED_EMAIL bắt buộc}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD bắt buộc}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3333/auth/login',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/nguyentrucanhtuan/trcf-erp-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: http://backend:3333
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET bắt buộc — openssl rand -hex 32}
      AUTH_TRUST_HOST: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
